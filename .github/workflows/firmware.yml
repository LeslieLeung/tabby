# Build Tabby for ESP32-P4 (IDF 5.4.4) and publish GitHub Release assets.
#
# - pull_request / push to main: compile only, upload artifacts
# - tag v*: compile, pack cjk16.bin, create a Release
# - workflow_dispatch: firmware + font artifacts (no Release)
#
# Flash the merged image from offset 0x0:
#   esptool.py --chip esp32p4 -p PORT write_flash 0x0 tabby-*-flash.bin

name: firmware

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: managed_components
          key: idf-managed-${{ hashFiles('dependencies.lock.esp32p4', 'main/idf_component.yml') }}

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32p4
          command: idf.py build merge-bin -o tabby-flash.bin -f raw

      - name: Stage artifacts
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="g${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          if [[ -f tabby-flash.bin ]]; then
            merged=tabby-flash.bin
          elif [[ -f build/tabby-flash.bin ]]; then
            merged=build/tabby-flash.bin
          else
            echo "merged flash image not found" >&2
            ls -la . build/*.bin || true
            exit 1
          fi
          cp "${merged}" "dist/tabby-${ver}-flash.bin"
          cp build/tabby.bin "dist/tabby-${ver}.bin"
          cp build/bootloader/bootloader.bin "dist/tabby-${ver}-bootloader.bin"
          cp build/partition_table/partition-table.bin "dist/tabby-${ver}-partitions.bin"
          cp build/ota_data_initial.bin "dist/tabby-${ver}-otadata.bin"
          cp build/flasher_args.json dist/flasher_args.json
          {
            echo "Tabby ${ver} for M5Stack Tab5 (ESP32-P4)"
            echo
            echo "Merged image (easiest):"
            echo "  esptool.py --chip esp32p4 -p PORT write_flash 0x0 tabby-${ver}-flash.bin"
            echo
            echo "Split images (from flasher_args.json):"
            echo "  0x2000  bootloader"
            echo "  0x8000  partitions"
            echo "  0xe000  otadata"
            echo "  0x10000 app (tabby-${ver}.bin)"
            echo
            echo "Optional CJK font for the SD card: cjk16.bin -> /fonts/cjk16.bin"
          } > dist/FLASH.txt
          echo "Staged firmware ${ver}"

      - uses: actions/upload-artifact@v4
        with:
          name: tabby-firmware
          path: dist/
          if-no-files-found: error

  font:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pack Unifont
        run: python3 tools/pack_cjk_font.py -o cjk16.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cjk16.bin
          path: cjk16.bin
          if-no-files-found: error

  release:
    needs: [build, font]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Flash

            Merged image from offset `0x0`:

            ```bash
            esptool.py --chip esp32p4 -p PORT write_flash 0x0 tabby-${{ github.ref_name }}-flash.bin
            ```

            Optional SD CJK font: copy `cjk16.bin` to `/fonts/cjk16.bin` on the microSD card.
          files: |
            artifacts/tabby-firmware/*
            artifacts/cjk16.bin/cjk16.bin
